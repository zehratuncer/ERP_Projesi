<div class="login-wrapper">
  <div class="login-card card">
    <div class="login-header">
      <div class="logo">🚀</div>
      <h2>ERP Giriş Paneli</h2>
      <p>Kurumsal yönetim hesabınıza erişin</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label for="email">E-Posta Adresi</label>
        <input
          id="email"
          type="email"
          [(ngModel)]="email"
          name="email"
          class="form-control"
          placeholder="admin@erp.com"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Şifre</label>
        <input
          id="password"
          type="password"
          [(ngModel)]="password"
          name="password"
          class="form-control"
          placeholder="••••••••"
          required
        />
      </div>

      <button type="submit" [disabled]="isLoading" class="btn btn-primary btn-block">
        @if (isLoading) {
          <span>Giriş Yapılıyor...</span>
        } @else {
          <span>Giriş Yap ➔</span>
        }
      </button>
    </form>

    <div class="demo-credentials">
      <span>Demo Yönetici Girişi:</span>
      <code>admin&#64;erp.com / Admin123!</code>
    </div>
  </div>
</div>
